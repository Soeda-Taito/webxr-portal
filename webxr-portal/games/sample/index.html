<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEBULA SPACE</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
<a-scene background="color: #050817">
  <a-sky color="#050817"></a-sky>
  <a-plane position="0 -1.5 0" rotation="-90 0 0" width="40" height="40" color="#101b3d"></a-plane>

  <a-sphere position="0 1 -5" radius="1.5" color="#824bff"
    material="emissive: #321477; emissiveIntensity: 0.5"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 15000">
  </a-sphere>

  <a-sphere position="3 2 -7" radius="0.15" color="#ffffff"></a-sphere>
  <a-sphere position="-4 3 -6" radius="0.12" color="#71dfff"></a-sphere>
  <a-sphere position="2 -0.5 -3" radius="0.1" color="#ffffff"></a-sphere>
  <a-sphere position="-3 1 -9" radius="0.2" color="#a78bff"></a-sphere>

  <a-text value="WELCOME TO NEBULA SPACE" position="-2 3 -5" color="#ffffff" width="5"></a-text>

  <!-- A-FrameのVRボタンからVRモードを開始できます -->
  <a-entity position="0 0 0">
    <a-camera></a-camera>
  </a-entity>
</a-scene>
</body>
</html>
